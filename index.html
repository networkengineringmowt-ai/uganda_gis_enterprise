<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Uganda GIS Enterprise Portal - Single Pane of Glass for NRMS, NTIS, NBMS, NPMS" />
    <title>Uganda GIS Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" crossorigin src="/uganda_gis_enterprise/assets/index-CLBcCEYM.js"></script>
    <link rel="stylesheet" crossorigin href="/uganda_gis_enterprise/assets/index-BI0aO_qE.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    (function(){
      function mkBtn(label,handler){
        var b=document.createElement('button');
        b.textContent=label;
        b.style.cssText='padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.6);color:#fff;font-size:0.72rem;cursor:pointer;font-weight:600;line-height:1;';
        b.onclick=function(e){e.stopPropagation();e.preventDefault();handler();};
        return b;
      }
      function addChartBtn(canvas){
        if(canvas.dataset.qvDone)return;
        canvas.dataset.qvDone='1';
        var card=canvas.closest('.glass-card')||canvas.parentElement;
        if(!card)return;
        var cs=getComputedStyle(card);
        if(cs.position==='static')card.style.position='relative';
        var wrap=document.createElement('div');
        wrap.style.cssText='position:absolute;top:14px;right:16px;z-index:6;';
        wrap.appendChild(mkBtn('PNG',function(){
          try{
            var a=document.createElement('a');
            a.href=canvas.toDataURL('image/png');
            a.download='chart_export.png';
            document.body.appendChild(a);a.click();document.body.removeChild(a);
          }catch(err){alert('Could not export this chart image.');}
        }));
        card.appendChild(wrap);
      }
      function addMapBtns(mapEl){
        if(mapEl.dataset.qvDone)return;
        mapEl.dataset.qvDone='1';
        var wrap=document.createElement('div');
        wrap.style.cssText='position:absolute;top:10px;right:10px;z-index:1000;display:flex;gap:6px;';
        wrap.appendChild(mkBtn('PNG',function(){
          if(!window.html2canvas){alert('Export library still loading, please try again in a moment.');return;}
          window.html2canvas(mapEl,{useCORS:true,logging:false}).then(function(cv){
            var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='map_export.png';
            document.body.appendChild(a);a.click();document.body.removeChild(a);
          }).catch(function(){alert('Could not capture this map image (basemap tiles blocked the export). Try again after the map finishes loading.');});
        }));
        wrap.appendChild(mkBtn('PDF',function(){
          if(!window.html2canvas||!window.jspdf){alert('Export library still loading, please try again in a moment.');return;}
          window.html2canvas(mapEl,{useCORS:true,logging:false}).then(function(cv){
            var pdf=new window.jspdf.jsPDF({orientation:cv.width>cv.height?'landscape':'portrait',unit:'pt'});
            var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
            var sc=Math.min(pw/cv.width,ph/cv.height),iw=cv.width*sc,ih=cv.height*sc;
            pdf.addImage(cv.toDataURL('image/png'),'PNG',(pw-iw)/2,(ph-ih)/2,iw,ih);
            pdf.save('map_export.pdf');
          }).catch(function(){alert('Could not capture this map for PDF export (basemap tiles blocked the export). Try again after the map finishes loading.');});
        }));
        if(getComputedStyle(mapEl).position==='static')mapEl.style.position='relative';
        mapEl.appendChild(wrap);
      }
      function scan(){
        document.querySelectorAll('canvas').forEach(addChartBtn);
        document.querySelectorAll('.leaflet-container').forEach(addMapBtns);
      }
      var mo=new MutationObserver(function(){scan();});
      mo.observe(document.body,{childList:true,subtree:true});
      scan();
      window.addEventListener('load',scan);
      setInterval(scan,2000);
    })();
    </script>
    <script>
    (function(){
      // ---- Top / Back / Export floating control cluster ----
      // Appended directly to <body> (a sibling of #root) so it survives every
      // React re-render untouched -- no MutationObserver needed for this piece.
      var FONT = 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
      var navHistory = [];
      var suppressHistory = false;
      var toastTimer = null;

      function getContentEl(){ return document.querySelector('.content-container'); }
      function getActiveNav(){ return document.querySelector('.nav-item.active'); }
      function navLabel(el){ return el ? (el.innerText || '').replace(/\s+/g,' ').trim() : ''; }

      function showToast(msg){
        var t = document.getElementById('qv-toast');
        if(!t){
          t = document.createElement('div');
          t.id = 'qv-toast';
          t.style.cssText = 'position:fixed;top:78px;right:24px;z-index:100000;'+
            'background:rgba(10,10,15,0.92);color:#fff;font:600 0.78rem '+FONT+';'+
            'padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);'+
            'box-shadow:0 8px 32px rgba(0,0,0,0.45);opacity:0;transform:translateY(-6px);'+
            'transition:opacity .22s ease,transform .22s ease;pointer-events:none;';
          document.body.appendChild(t);
        }
        t.textContent = msg;
        clearTimeout(toastTimer);
        requestAnimationFrame(function(){
          t.style.opacity = '1'; t.style.transform = 'translateY(0)';
        });
        toastTimer = setTimeout(function(){
          t.style.opacity = '0'; t.style.transform = 'translateY(-6px)';
        }, 2200);
      }

      function csvEscape(v){
        v = (v == null) ? '' : String(v);
        if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
        return v;
      }

      function tablesToCSV(tables){
        var lines = [];
        tables.forEach(function(table, ti){
          if(ti > 0) lines.push('');
          var heading = table.closest('[data-export-title]');
          if(heading) lines.push(csvEscape(heading.getAttribute('data-export-title')));
          Array.from(table.rows).forEach(function(row){
            var cells = Array.from(row.cells).map(function(c){ return csvEscape(c.innerText.replace(/\s+/g,' ').trim()); });
            lines.push(cells.join(','));
          });
        });
        return lines.join('\n');
      }

      function downloadBlob(content, filename, type){
        var blob = new Blob([content], {type: type});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      }

      function safeName(s){
        return (s || 'export').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'export';
      }

      function doExport(btn){
        var content = getContentEl();
        if(!content){ showToast('Nothing to export yet'); return; }
        var activeLabel = navLabel(getActiveNav()) || 'view';
        var stamp = new Date().toISOString().slice(0,10);
        var tables = Array.from(content.querySelectorAll('table')).filter(function(t){
          return t.offsetWidth > 0 && t.offsetHeight > 0 && t.rows.length > 0;
        });
        if(tables.length){
          var csv = tablesToCSV(tables);
          downloadBlob(csv, safeName(activeLabel) + '-' + stamp + '.csv', 'text/csv;charset=utf-8;');
          showToast('Exported ' + tables.length + ' table' + (tables.length>1?'s':'') + ' as CSV');
          return;
        }
        if(!window.html2canvas){
          showToast('Export library still loading, try again shortly');
          return;
        }
        btn.classList.add('qv-btn-busy');
        window.html2canvas(content, {useCORS:true, logging:false, backgroundColor:'#0a0a0f'}).then(function(canvas){
          btn.classList.remove('qv-btn-busy');
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = safeName(activeLabel) + '-' + stamp + '.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          showToast('Exported ' + activeLabel + ' as image');
        }).catch(function(){
          btn.classList.remove('qv-btn-busy');
          showToast('Could not capture this view for export');
        });
      }

      function doBack(){
        if(!navHistory.length) return;
        var prev = navHistory.pop();
        if(prev && document.body.contains(prev)){
          suppressHistory = true;
          prev.click();
          setTimeout(function(){ suppressHistory = false; }, 0);
        }
        updateBackState();
      }

      function doTop(){
        var content = getContentEl();
        if(content) content.scrollTo({top:0, behavior:'smooth'});
      }

      var topBtn, backBtn, exportBtn, cluster;

      function positionCluster(){
        if(!cluster) return;
        // Narrow viewports: the topbar's own contents usually wrap/hide, so
        // anchor the cluster to the bottom-right instead of guessing overlap.
        if(window.innerWidth < 900){
          cluster.style.left = 'auto';
          cluster.style.right = '16px';
          cluster.style.top = 'auto';
          cluster.style.bottom = '16px';
          return;
        }
        var topbar = document.querySelector('.topbar');
        if(!topbar){ cluster.style.top = '14px'; cluster.style.right = '24px'; cluster.style.left='auto'; cluster.style.bottom='auto'; return; }
        var tbRect = topbar.getBoundingClientRect();
        // Find the existing right-side content of the topbar (status pill /
        // settings / profile icons) and sit just to its left, so the new
        // cluster never overlaps whatever the app already renders there.
        var rightBlock = topbar.lastElementChild;
        var gap = 16;
        var rightEdgeFromViewport = window.innerWidth - 24;
        if(rightBlock && rightBlock !== topbar.firstElementChild){
          var rbRect = rightBlock.getBoundingClientRect();
          if(rbRect.width > 0) rightEdgeFromViewport = rbRect.left - gap;
        }
        var clusterWidth = cluster.offsetWidth || 126;
        cluster.style.bottom = 'auto';
        cluster.style.left = Math.max(8, rightEdgeFromViewport - clusterWidth) + 'px';
        cluster.style.right = 'auto';
        cluster.style.top = Math.round(tbRect.top + (tbRect.height - (cluster.offsetHeight || 34)) / 2) + 'px';
      }

      function updateBackState(){
        if(!backBtn) return;
        var enabled = navHistory.length > 0;
        backBtn.style.opacity = enabled ? '1' : '0.32';
        backBtn.style.cursor = enabled ? 'pointer' : 'default';
        backBtn.style.pointerEvents = enabled ? 'auto' : 'none';
        backBtn.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      }

      function updateTopVisibility(){
        var content = getContentEl();
        var scrolled = content && content.scrollTop > 160;
        if(!topBtn) return;
        topBtn.style.opacity = scrolled ? '1' : '0';
        topBtn.style.transform = scrolled ? 'translateY(0) scale(1)' : 'translateY(-4px) scale(0.92)';
        topBtn.style.pointerEvents = scrolled ? 'auto' : 'none';
      }

      function mkIconBtn(id, svgPath, viewBox, label){
        var b = document.createElement('button');
        b.id = id;
        b.type = 'button';
        b.setAttribute('aria-label', label);
        b.style.cssText =
          'display:flex;align-items:center;justify-content:center;'+
          'width:34px;height:34px;border-radius:10px;'+
          'background:rgba(10,10,15,0.7);border:1px solid rgba(255,255,255,0.1);'+
          'backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(0,0,0,0.3);'+
          'cursor:pointer;position:relative;transition:transform .15s ease,background .15s ease,box-shadow .15s ease;'+
          'padding:0;';
        b.innerHTML =
          '<svg width="16" height="16" viewBox="'+viewBox+'" fill="none" stroke="currentColor" '+
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#fff">'+svgPath+'</svg>';

        var tip = document.createElement('span');
        tip.textContent = label;
        tip.style.cssText =
          'position:absolute;top:42px;right:0;white-space:nowrap;'+
          'background:rgba(10,10,15,0.95);color:#fff;font:600 0.68rem '+FONT+';'+
          'padding:5px 9px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);'+
          'opacity:0;transform:translateY(-3px);pointer-events:none;'+
          'transition:opacity .15s ease,transform .15s ease;z-index:1;';
        b.appendChild(tip);

        b.addEventListener('mouseenter', function(){
          if(b.getAttribute('aria-disabled') === 'true') return;
          b.style.transform = 'translateY(-1px) scale(1.06)';
          b.style.background = 'rgba(30,30,40,0.85)';
          b.style.boxShadow = '0 6px 20px rgba(0,0,0,0.4)';
          tip.style.opacity = '1'; tip.style.transform = 'translateY(0)';
        });
        b.addEventListener('mouseleave', function(){
          b.style.transform = 'translateY(0) scale(1)';
          b.style.background = 'rgba(10,10,15,0.7)';
          b.style.boxShadow = '0 4px 16px rgba(0,0,0,0.3)';
          tip.style.opacity = '0'; tip.style.transform = 'translateY(-3px)';
        });
        b.addEventListener('mousedown', function(){ b.style.transform = 'translateY(0) scale(0.94)'; });
        b.addEventListener('mouseup', function(){ b.style.transform = 'translateY(-1px) scale(1.06)'; });
        return b;
      }

      function init(){
        if(document.getElementById('qv-nav-cluster')) return;
        cluster = document.createElement('div');
        cluster.id = 'qv-nav-cluster';
        cluster.style.cssText =
          'position:fixed;top:14px;right:24px;z-index:99998;'+
          'display:flex;align-items:center;gap:8px;';

        topBtn = mkIconBtn('qv-top-btn',
          '<line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline>',
          '0 0 24 24', 'Scroll to top');
        topBtn.style.opacity = '0';
        topBtn.style.transform = 'translateY(-4px) scale(0.92)';
        topBtn.style.pointerEvents = 'none';
        topBtn.addEventListener('click', doTop);

        backBtn = mkIconBtn('qv-back-btn',
          '<polyline points="15 18 9 12 15 6"></polyline>',
          '0 0 24 24', 'Back to previous tab');
        backBtn.addEventListener('click', doBack);

        exportBtn = mkIconBtn('qv-export-btn',
          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
          '0 0 24 24', 'Export this view');
        exportBtn.addEventListener('click', function(){ doExport(exportBtn); });

        cluster.appendChild(topBtn);
        cluster.appendChild(backBtn);
        cluster.appendChild(exportBtn);
        document.body.appendChild(cluster);

        var style = document.createElement('style');
        style.textContent = '.qv-btn-busy{opacity:0.6 !important;cursor:progress !important;}';
        document.head.appendChild(style);

        updateBackState();
        positionCluster();

        // Scroll-driven Top visibility: capture phase catches scroll on any
        // descendant (including .content-container, which doesn't bubble).
        document.addEventListener('scroll', updateTopVisibility, true);
        setInterval(updateTopVisibility, 800);
        window.addEventListener('resize', positionCluster);
        setInterval(positionCluster, 1000);

        // Track sidebar tab switches for Back, via capture-phase click delegation
        // (works even if React replaces the nav-item nodes on re-render).
        document.addEventListener('click', function(e){
          if(suppressHistory) return;
          var item = e.target.closest && e.target.closest('.nav-item');
          if(!item) return;
          var currentlyActive = getActiveNav();
          if(currentlyActive && currentlyActive !== item){
            navHistory.push(currentlyActive);
            if(navHistory.length > 25) navHistory.shift();
            setTimeout(updateBackState, 0);
          }
        }, true);
      }

      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      window.addEventListener('load', init);
      setInterval(init, 2000);
    })();
    </script>
  </body>
